name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            asset_name: shuoha-darwin-amd64.tar.gz
            binary_name: shuoha
          - os: macos-14
            asset_name: shuoha-darwin-arm64.tar.gz
            binary_name: shuoha
          - os: windows-latest
            asset_name: shuoha-windows-amd64.zip
            binary_name: shuoha.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Build standalone binary
        run: |
          python -m PyInstaller \
            --clean \
            --noconfirm \
            --collect-all akshare \
            --onefile \
            --name shuoha \
            --paths src \
            src/shuoha/__main__.py

      - name: Package archive on macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release
          cp "dist/${{ matrix.binary_name }}" "release/${{ matrix.binary_name }}"
          tar -C release -czf "${{ matrix.asset_name }}" "${{ matrix.binary_name }}"

      - name: Package archive on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "dist/${{ matrix.binary_name }}" "release/${{ matrix.binary_name }}"
          Compress-Archive -Path "release/${{ matrix.binary_name }}" -DestinationPath "${{ matrix.asset_name }}" -Force

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
