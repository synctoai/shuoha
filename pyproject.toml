[project]
name = "shuoha"
version = "0.1.0"
description = "Beginner-friendly A-share stock CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "akshare>=1.16.0",
  "pandas>=2.2.0",
  "pydantic>=2.8.0",
  "rich>=13.9.0",
  "typer>=0.16.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]
agent = [
  "deepagents>=0.0.0",
  "openai>=2.0.0",
]

[project.scripts]
shuoha = "shuoha.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
